[project]
name = "spxquant-research"
version = "8.0.0a1"
description = "Research tooling for SPX Quant Scalper Pro v8 (no trading capability)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
research = ["scipy>=1.11", "scikit-learn>=1.3"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
